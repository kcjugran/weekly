<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://api.github.com https://*.trycloudflare.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Weekly</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="phone.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 id="title" class="title">Today</h1>
      <p id="sub" class="sub"></p>
    </div>
    <span id="count" class="count"></span>
  </header>
  <div class="bar"><i id="bar"></i></div>

  <nav id="tabs" class="tabs" role="tablist" aria-label="Days"></nav>
  <p id="banner" class="banner" role="status" hidden></p>

  <main>
    <div id="chips" class="chips" hidden></div>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>

    <form id="add" class="add" autocomplete="off" hidden>
      <button id="add-toggle" class="add-toggle" type="button" aria-expanded="false"
              aria-label="Add activity">+</button>
      <button id="add-clock" class="clock add-field" type="button" aria-pressed="false" aria-label="Set a time"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button id="add-save" class="clock add-field" type="button" aria-pressed="false"
              aria-label="Save to autofill"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 4.5h10v15l-5-3.6-5 3.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
      <input id="add-name" class="add-field" list="names" placeholder="Activity" maxlength="80" required
             enterkeyhint="done" aria-label="Activity">
      <datalist id="names"></datalist>
      <button class="add-field" type="submit">Add</button>
      <input id="add-time" class="add-field time-line" type="time" aria-label="Time" hidden>
    </form>
  </main>

  <button id="logout" class="logout" type="button" hidden>Log out</button>

  <!-- Edit one activity (applies to that weekday, every week) -->
  <form id="edit" class="sheet" autocomplete="off" hidden>
    <h2 class="sheet-title">Edit</h2>
    <p id="edit-sub" class="sub"></p>
    <label for="edit-time">Time <span class="opt">optional</span></label>
    <div class="time-row">
      <button id="edit-clock" class="clock" type="button" aria-pressed="false" aria-label="Set a time"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <input id="edit-time" type="time" hidden>
      <span id="edit-notime" class="notime">No set time</span>
    </div>
    <label for="edit-name">Activity</label>
    <input id="edit-name" list="names" maxlength="80" required enterkeyhint="done">
    <div class="sheet-actions">
      <button type="submit" class="primary">Save</button>
      <button id="edit-cancel" type="button" class="quiet">Cancel</button>
    </div>
    <button id="edit-delete" type="button" class="danger">Delete from this day</button>
  </form>

  <!-- Quick picks: the activities you add most, one tap on any day tab -->
  <div id="picks" class="sheet" hidden>
    <h2 class="sheet-title">Quick picks</h2>
    <p class="sub">One tap on a day adds them</p>
    <ul id="picks-list" class="list"></ul>
    <form id="picks-add" class="add" autocomplete="off">
      <button id="picks-clock" class="clock" type="button" aria-pressed="false" aria-label="Set a time"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <input id="picks-name" list="names" placeholder="Activity" maxlength="80" required enterkeyhint="done" aria-label="Activity">
      <button type="submit">Add</button>
      <input id="picks-time" class="time-line" type="time" aria-label="Time" hidden>
    </form>
    <div class="sheet-actions"><button id="picks-done" type="button" class="primary">Done</button></div>
  </div>

  <!-- Autofill: only names he chose to save (mistypes and one-offs stay out) -->
  <div id="saved" class="sheet" hidden>
    <h2 class="sheet-title">Autofill</h2>
    <p class="sub">Suggested as you type, with your quick picks</p>
    <ul id="saved-list" class="list"></ul>
    <form id="saved-add" class="add" autocomplete="off">
      <input id="saved-name" placeholder="Activity" maxlength="80" required enterkeyhint="done" aria-label="Activity">
      <button type="submit">Save</button>
    </form>
    <div class="sheet-actions"><button id="saved-done" type="button" class="primary">Done</button></div>
  </div>

  <form id="gate" class="gate" hidden>
    <h2 id="gate-title" class="gate-title">Log in</h2>
    <label for="g-user">ID</label>
    <input id="g-user" name="username" autocomplete="username" autocapitalize="off" autocorrect="off"
           spellcheck="false" maxlength="64" required>
    <label for="g-pass">Password</label>
    <input id="g-pass" name="password" type="password" autocomplete="current-password" maxlength="200" required>
    <div id="setup-only" hidden>
      <label for="g-key">Setup key</label>
      <input id="g-key" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <p class="hint">On your PC: Weekly\data\phone_key.txt. Needed once, to create the login.</p>
    </div>
    <p id="gate-msg" class="gate-msg" role="alert"></p>
    <button id="gate-btn" type="submit">Log in</button>
    <button id="gate-switch" class="linkish" type="button">First time? Create login</button>
  </form>

  <template id="tick-tpl">
    <li class="row"><button class="hit" type="button" role="checkbox" aria-checked="false">
      <span class="box"></span>
      <span class="time"><span class="hm"></span><span class="ap"></span></span>
      <span class="name"></span>
      <span class="streak"><span class="n"></span></span>
    </button><button class="more" type="button">&hellip;</button></li>
  </template>
  <template id="plan-tpl">
    <li class="row plan">
      <button class="open" type="button">
        <span class="time"><span class="hm"></span><span class="ap"></span></span>
        <span class="name"></span>
      </button>
      <button class="del" type="button" aria-label="Remove">&times;</button>
    </li>
  </template>

  <script type="module" src="phone.js"></script>
</body>
</html>
